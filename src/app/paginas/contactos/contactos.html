<head>
    <title>Contacto - Pizzería Don Luigi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            padding-top: 100px;
        }

        .header-section {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
            padding: 2rem 0;
            text-align: center;
            margin-bottom: 3rem;
        }

        .contact-container {
            max-width: 700px;
            margin: 0 auto 3rem;
        }

        .contact-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid #e9ecef;
        }

        .contact-header {
            background: linear-gradient(135deg, #ffa600 0%, #ff4d00 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .form-section {
            padding: 2.5rem;
        }

        .form-label {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }

        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 0.875rem 1.25rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
            background: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff8000 0%, #ff1500 100%);
            border: none;
            border-radius: 12px;
            padding: 0.875rem 2rem;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .contact-info {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 16px;
            padding: 2rem;
            margin-top: 2rem;
            border: 1px solid #dee2e6;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .info-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #ff8000 0%, #ff1500 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.25rem;
            margin-right: 1rem;
            flex-shrink: 0;
        }

        .footer-section {
            background: #2c3e50;
            color: white;
            padding: 2rem 0;
            text-align: center;
            margin-top: 4rem;
        }

        @media (max-width: 768px) {
            .form-section {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="header-section">
    <div class="container">
        <h1 class="fw-bold mb-3" style="color: #2c3e50;">🍕 Pizzería Don Luigi</h1>
        <p class="lead mb-0" style="color: #6c757d;">Contáctanos para pedidos o consultas</p>
    </div>
</div>

<!-- Contenedor principal -->
<div class="contact-container">
    
    <!-- Card de contacto -->
    <div class="contact-card">
        
        <!-- Header del formulario -->
        <div class="contact-header">
            <h2 class="mb-1 fw-bold">Formulario de Contacto</h2>
            <p class="mb-0 opacity-90">Te responderemos en menos de 24hs</p>
        </div>

        <!-- Formulario -->
        <div class="form-section">
            <form>
                <div class="mb-4">
                    <label class="form-label">👤 Nombre completo</label>
                    <input type="text" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">📧 Correo electrónico</label>
                    <input type="email" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">📱 Teléfono (opcional)</label>
                    <input type="tel" class="form-control">
                </div>

                <div class="mb-4">
                    <label class="form-label">💬 Tu mensaje</label>
                    <textarea class="form-control" rows="5" required 
                              style="resize: vertical; min-height: 120px;"></textarea>
                </div>

                <button type="submit" class="btn btn-primary shadow-lg">
                    <i class="bi bi-send me-2"></i>Enviar Mensaje
                </button>
            </form>
        </div>

    </div>

    <!-- Información de contacto -->
    <div class="contact-info">
        <h6 class="fw-bold mb-4 text-center" style="color: #2c3e50;">También puedes contactarnos directamente</h6>
        
        <div class="row text-center text-lg-start">
            <div class="col-md-4 mb-3">
                <div class="info-item justify-content-center justify-content-md-start">
                    <div class="info-icon">
                        <i class="bi bi-geo-alt"></i>
                    </div>
                    <div>
                        <strong>Cipolletti, Río Negro</strong>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="info-item justify-content-center justify-content-md-start">
                    <div class="info-icon">
                        <i class="bi bi-telephone"></i>
                    </div>
                    <div>
                        <strong>299-123-4567</strong>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="info-item justify-content-center justify-content-md-start">
                    <div class="info-icon">
                        <i class="bi bi-clock"></i>
                    </div>
                    <div>
                        <strong>Lun-Dom 11:00-23:00</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Footer -->
<footer class="footer-section">
    <div class="container">
        <p class="mb-0 opacity-90">© 2025 Pizzería Don Luigi - Il Conto Porfavore</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
