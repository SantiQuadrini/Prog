<!-- CONTENEDOR PRINCIPAL -->
<div class="productos-wrapper">

  <!-- TÍTULO -->
  <h2 class="productos-titulo">🍕 Nuestro Menú</h2>

  <!-- BARRA DE BÚSQUEDA -->
  <div class="buscador-wrapper">
    <div class="buscador-input">
      <i class="bi bi-search"></i>
      <input type="text" 
             placeholder="Buscar pizza...">
    </div>
  </div>

  <!-- PRODUCTOS -->
  <div class="productos-container">
    @for(p of Productos; track p.id){
      <div class="producto-card" [class.inactivo]="!p.disponibilidad">
        <div class="producto-imagen">
          <img src="{{p.imagen}}" alt="{{p.nombre}}">
          
          <button type="button" class="btn-favorito">
            <span class="star-icon">⭐</span>
          </button>
        </div>
        
        <div class="producto-info">
          <h3 class="producto-nombre">{{p.nombre}}</h3>
          <h4 class="producto-precio">${{p.precio}}</h4>
          <p class="producto-descripcion">{{p.informacion}}</p>
      
          @if(p.disponibilidad) {
            <button type="button" class="btn-compra" (click)="agregarProducto(p)">
              agregar al carrito
            </button>
          } @else {
            <button type="button" class="btn-sin-stock" disabled>
              SIN STOCK
            </button>
          }
        </div>
      </div>
    }
  </div>

</div>
