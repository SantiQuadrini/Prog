<section class="ofertas-page container py-5">
  <h1 class="titulo-ofertas">Ofertas destacadas</h1>

  <p class="text-center mb-4">
    Aprovechá los mejores descuentos en iPhone con entrega rápida desde Patagonia.
  </p>

  <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4 justify-content-center">
    @for (p of ofertas; track p.id) {
      <div class="col d-flex justify-content-center">
        <div class="card shadow-sm h-100">
          <span class="badge bg-danger position-absolute m-3">Oferta</span>
          <img src="{{p.imagen}}" class="card-img-top" alt="{{p.nombre}}">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{p.nombre}}</h5>
            <p class="card-text">{{p.descripcion}}</p>
            <h4 class="text-danger">${{p.precio}}</h4>
            <p class="small text-muted">Stock disponible: {{p.stock}}</p>
            <div class="mt-auto d-flex gap-2 flex-wrap">
              <button type="button" class="btn btn-primary" (click)="agregarCarrito(p)">Añadir al carrito</button>
              <button type="button" class="btn btn-outline-warning" (click)="agregarFavorito(p)">Agregar a favoritos</button>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</section>
