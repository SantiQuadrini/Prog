<div class="modal fade" id="loginModal" tabindex="-1">

      <div class="modal-header border-0 pb-3">
        <h5 class="modal-title fw-bold" style="color: #ff6a00;">

        </h5>

      <div class="modal-body px-4 py-3">

            </label>

                   placeholder="********"
                   style="border-radius: 12px; background: #f8f9fa;">
          </div>

          <button type="submit"
                  class="btn w-100 shadow-sm fw-semibold py-2"
                  style="
                    background: linear-gradient(135deg, #ff8000 0%, #ff1500 100%);
                    border: none;
                    border-radius: 12px;
                    color: white;
